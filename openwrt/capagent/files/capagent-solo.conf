# One CAP identity with eight fake radios (v0.6.4+).
#
# Copy to /etc/cap/capagent.conf to make the MikroTik "Remote CAP" tab show a
# single CAP with eight radios instead of eight CAP identities (one per SSID).
# The manager must have one provisioning rule per radio MAC below, each with
# master-configuration=<that SSID> and no slaves (the same rules the
# multi-identity mode uses; the SSIDs/security/VLAN still come from the
# manager).
#
# Without this file capagent uses the normal single-identity topology
# (MACS=auto, the real radios), which needs no per-SSID rules but only the
# master BSSes authenticate on this manager.

MANAGER=auto
DISCOVERY_INTERFACES=wan
PORT=5246

CERT=/etc/cap/id-solo.pem
KEY=/etc/cap/id-solo.key
CA_CERT=/etc/cap/ca.pem
IDENTITY=OpenWrt-CAPSOLO

# Four fake 2.4 GHz radios on phy0, four fake 5 GHz radios on phy1.  The 5 GHz
# first bytes must differ (mt76x2 BSS index); see docs/MULTI-IDENTITY.md.
MACS=02:D1:27:1B:2D:A0,02:D1:27:1B:2D:A1,02:D1:27:1B:2D:A2,02:D1:27:1B:2D:A3,2A:D1:27:1B:2D:90,2E:D1:27:1B:2D:90,22:D1:27:1B:2D:90,26:D1:27:1B:2D:90
PHYS=0,0,0,0,1,1,1,1

# Distinct hostapd/netdev suffix; the tagged path also bridges each BSS after
# hostapd starts (required when several APs share a phy).
RUN_TAG=solo
EXT_AUTH_DIR=/var/run/hostapdsolo
VAP_STATE=/var/run/capsolo.state

# Pure-OWE VAPs are completed by this hostapd by default (RouterOS 7.25.1
# has no manager-side OWE DH); LOCAL_OWE=no restores the old relay.
# LOCAL_OWE=yes

# traffic-processing=on-capsman (a2=1/a2=2) needs the c2 datachan and the
# AF_PACKET bridge.  The manager only offers on-capsman on the 5 GHz radio of
# this reference CAP; the 2.4 GHz radio stays on-cap (a2=0).
# DATACHAN=yes
# DATAPATH_BRIDGE=yes

EAPOL_LEG=both
MGMT_RELAY=yes
MGMT_SOURCE=off
COUNTRY=GR
WIRELESS_OWNER=auto
