# Zero-touch CAP defaults — sourced by /etc/init.d/capagent.
#
# Nothing in here names an SSID, a key or a VLAN: those come from the manager.
# The agent discovers the CAPsMAN v2 manager (DHCP option 138, or the
# broadcast on the WAN), enrols a certificate on first boot when /etc/cap is
# empty, and then provisions every BSS the manager asks for.

# Manager discovery.  "auto" = DHCP option 138, then broadcast.
MANAGER=auto
DISCOVERY_INTERFACES=wan
PORT=5246
WAIT_IF=wan

# Certificate.  No key or certificate is baked into the image: the agent
# generates them and enrols on first boot.
CERT=/etc/cap/client.pem
KEY=/etc/cap/client.key
CA_CERT=/etc/cap/ca.pem

# Split-MAC: the manager is the RSN authenticator, so the CAP runs hostapd
# with external_rsn_auth and relays EAPOL.  The no-monitor path relays the raw
# Auth/AssocReq as 0x2018, which is what a 4-interface radio needs - and it is
# the path that is proven end to end (monitor mode costs a vif slot on the
# 2.4 GHz radio and the station never completes the 4-way there).
EAPOL_LEG=both
MGMT_RELAY=yes
MGMT_SOURCE=off
EXT_AUTH_DIR=/var/run/hostapd

# Keep the manager's BSSID on pre-created secondaries.  Dynamic provisioning
# authenticates the manager-derived slave BSSIDs; the CAP starts one hostapd
# per 5/6 GHz BSS and keeps the single multi-BSS hostapd on 2.4 GHz.
KEEP_SEC=yes

# CAPsMAN v2 never sends a regulatory country.
COUNTRY=GR

# Ownership: ubus decides per netdev; a factory-reset image has no wifi-iface
# at all, so every manager VAP is ours.
WIRELESS_OWNER=auto
