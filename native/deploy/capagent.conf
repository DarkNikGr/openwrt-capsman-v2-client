# capagent runtime configuration
# Installed as /etc/cap/capagent.conf

# Required: the CAP certificate and key (enrolled with the manager).
CERT=/etc/cap/client.pem
KEY=/etc/cap/client.key

# Manager address. "auto" uses UDP discovery on DISCOVERY_INTERFACES.
MANAGER=auto
PORT=5246
DISCOVERY_INTERFACES=br-lan

# Skip TLS verification or verify against the manager CA.
DONT_VERIFY_CERTIFICATE=yes
# CA_CERT=/etc/cap/ca.pem
# CAPS_MAN_CERT_CN=WiFi-CAPsMAN-XXXXXXXXXXXX

# CAP identity / serial shown on the manager.
# IDENTITY=OpenWrt-CAP3
# SERIAL=28D1271B2D80

# Radio MACs (default: /sys/class/ieee80211/phy*).
MACS=auto

# Apply the configuration pushed by CAPsMAN to OpenWrt UCI.
# Ignored (refused, with a log line) whenever /etc/config/wireless contains at
# least one wifi-iface: that file owns the BSSes and capagent is read-only (W33).
APPLY=yes

# Enable the CAPsMAN c2 datachan (UDP 5248).
# Only armed in manager-only mode (zero wifi-iface), see W33.
DATACHAN=yes

# --- boot sequencing (W14) -------------------------------------------------
# Wait for this interface to have carrier + an IPv4 lease before joining.
# Defaults to the first DISCOVERY_INTERFACES entry.
# WAIT_IF=wan
# WAIT_TIMEOUT=300
# WAIT_ADDR=yes
# WAIT_HOSTAPD=yes

# --- manager-driven BSS + hostapd external RSN (W8) -----------------------
# Bind one AF_UNIX ext-auth socket per BSS in this directory.  Must match the
# hostapd build that understands external_rsn_auth/ext_auth_socket.
# EXT_AUTH_DIR=/var/run/hostapd
# EXT_CTRL_DIR=/var/run/hostapd
# STATE_FILE=/tmp/capagent.state
# FOURWAY_TIMEOUT=10000
# M1_RETRY=3000
#
# Relay real Auth/AssocReq frames to the manager (0x2018) instead of letting
# only hostapd see them.
# MGMT_RELAY=yes
# MGMT_SOURCE=auto
#
# --- ownership (W33) -------------------------------------------------------
# The mode is derived from the wifi-iface count in /etc/config/wireless:
#   >=1 section -> legacy, read-only (netifd/wpad owns the BSSes)
#    0 sections -> own, capagent creates the AP netdevs + hostapd instances
# Override only for debugging/tests; "auto" is the production setting.
# WIRELESS_CONFIG=/etc/config/wireless
# WIRELESS_OWNER=auto
# Keep our netdev/hostapd after a manager 0x600c destroy (default: tear down).
# VAP_TEARDOWN=yes
